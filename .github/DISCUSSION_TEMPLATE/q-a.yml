title: "[Question] "
labels: ["question"]
body:
  - type: textarea
    id: question
    attributes:
      label: Your question
    validations:
      required: true
  - type: textarea
    id: tried
    attributes:
      label: What have you tried?
  - type: checkboxes
    id: no-personal-info
    attributes:
      label: Privacy
      description: Discussions are public.
      options:
        - label: I have not included any personal information (mine or anyone else's).
          required: true
